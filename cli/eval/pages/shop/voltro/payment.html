<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voltro — Payment</title>
<link rel="stylesheet" href="checkout.css">
</head>
<body>
<header><b>Voltro</b><span>Secure checkout</span><a href="shipping.html">Back to shipping</a></header>
<div class="steps">Cart › Shipping › <b>Payment</b> › Review</div>
<main>
  <h1>Payment method</h1>
  <form id="pay" novalidate>
    <label for="card">Card number</label>
    <input id="card" autocomplete="off" inputmode="numeric">
    <label for="exp">Expiry (MM/YY)</label>
    <input id="exp" autocomplete="off" placeholder="MM/YY">
    <label for="cvv">CVV</label>
    <input id="cvv" autocomplete="off" inputmode="numeric" style="max-width:100px">
    <button type="submit" id="continue">Continue to review</button>
    <div id="status" role="status"></div>
  </form>
</main>
<footer>Voltro is a fictional retailer used for local browser-automation testing.
  Do not enter real card details.</footer>
<script>
const NONCE = '__SESSION_NONCE__';
const status = document.getElementById('status');
document.getElementById('pay').addEventListener('submit', async (event) => {
  event.preventDefault();
  const card = document.getElementById('card').value.trim();
  const exp = document.getElementById('exp').value.trim();
  const cvv = document.getElementById('cvv').value.trim();
  status.className = '';
  if (!/^\d{16}$/.test(card.replace(/[\s-]/g, '')) || !exp || !cvv) {
    status.className = 'error';
    status.textContent = 'Enter a 16-digit card number, expiry, and CVV.';
    return;
  }
  const button = document.getElementById('continue');
  button.disabled = true;
  try {
    const res = await fetch('/api/voltro/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nonce: NONCE, step: 'payment', card, exp, cvv }),
    });
    const body = await res.json();
    if (!res.ok) {
      status.className = 'error';
      status.textContent = body.error ?? 'Could not save the payment method.';
      return;
    }
    location.href = 'review.html';
  } catch {
    status.className = 'error';
    status.textContent = 'Network error — try again.';
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
