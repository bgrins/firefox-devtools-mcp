<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bluefern Authenticator</title>
<link rel="stylesheet" href="portal.css">
</head>
<body>
<header><h1>Bluefern Authenticator</h1></header>
<main>
  <div class="card">
    <h2>Your verification code</h2>
    <div id="code" class="bigcode" hidden></div>
    <div id="status" role="status">Fetching your current code…</div>
  </div>
  <p class="fine">Codes are issued per signed-in session by the Bluefern
  identity service.</p>
</main>
<script>
  const NONCE = '__SESSION_NONCE__';
  const status = document.getElementById('status');

  (async () => {
    try {
      const res = await fetch('/api/portal/code', {
        headers: { 'X-Eval-Nonce': NONCE },
      });
      const body = await res.json();
      if (!res.ok) {
        status.innerHTML =
          '<a href="index.html">Sign in with your password</a> before ' +
          'requesting a code.';
        return;
      }
      const slot = document.getElementById('code');
      slot.textContent = body.code;
      slot.hidden = false;
      status.textContent = 'Enter this code on the verification screen.';
    } catch {
      status.textContent = 'Network error — reload the page.';
    }
  })();
</script>
</body>
</html>
