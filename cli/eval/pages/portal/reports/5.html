<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report 5 — Bluefern Operations Portal</title>
<link rel="stylesheet" href="../portal.css">
</head>
<body>
<header><h1>Bluefern Operations Portal — Reports</h1></header>
<main>
  <nav class="reports-nav">
    <a href="1.html">Report 1</a>
    <a href="2.html">Report 2</a>
    <a href="3.html">Report 3</a>
    <a href="4.html">Report 4</a>
    <a href="5.html" aria-current="page">Report 5</a>
  </nav>
  <div class="card">
    <h2>Report 5</h2>
    <div id="status" role="status">Loading report…</div>
    <div id="report" hidden>
      <p id="label"></p>
      <p class="figure">Total: <span id="total"></span></p>
    </div>
    <div id="expired" class="banner" role="alert" hidden>
      <span id="expiredMsg"></span>
      <a href="/portal/?area=reports&amp;expired=1">Log in again</a>
    </div>
  </div>
</main>
<script>
  const NONCE = '__SESSION_NONCE__';
  const N = 5;

  (async () => {
    const status = document.getElementById('status');
    try {
      const res = await fetch('/api/portal/report?n=' + N, {
        headers: { 'X-Eval-Nonce': NONCE },
      });
      const body = await res.json();
      status.textContent = '';
      if (!res.ok) {
        document.getElementById('expiredMsg').textContent =
          body.error ?? 'Session expired — log in again.';
        document.getElementById('expired').hidden = false;
        return;
      }
      document.getElementById('label').textContent = body.label;
      document.getElementById('total').textContent = body.total;
      document.getElementById('report').hidden = false;
    } catch {
      status.textContent = 'Network error — reload the page.';
    }
  })();
</script>
</body>
</html>
