<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hacker Bulletin</title>
<style>
  body { font-family: Verdana, Geneva, sans-serif; font-size: 10pt; background: #f6f6ef; margin: 0; }
  #wrap { width: 85%; margin: 8px auto; background: #f6f6ef; }
  #topbar { background: #4a7023; padding: 4px 8px; color: #fff; }
  #topbar a { color: #fff; text-decoration: none; margin-right: 10px; }
  #topbar b { margin-right: 12px; }
  #logo { display: inline-block; width: 16px; height: 16px; border: 1px solid #fff;
          text-align: center; font-size: 9px; line-height: 16px; font-weight: 700;
          vertical-align: middle; margin-right: 6px; }
  .votearrow { width: 0; height: 0; border-left: 4px solid transparent;
               border-right: 4px solid transparent; border-bottom: 7px solid #9a9a9a; margin: 3px 4px 0 0; }
  table.itemlist { width: 100%; border-spacing: 0 2px; }
  .rank { color: #828282; text-align: right; vertical-align: top; padding-right: 4px; }
  .title a { color: #000; text-decoration: none; }
  .sitebit { color: #828282; font-size: 8pt; }
  .subtext { color: #828282; font-size: 7pt; padding-bottom: 6px; }
  .subtext a { color: #828282; }
  #footer { text-align: center; color: #828282; font-size: 8pt; border-top: 2px solid #4a7023;
            padding: 8px; margin-top: 8px; }
  #digestveil { position: fixed; inset: 0; background: rgba(40, 44, 32, 0.72);
                z-index: 90; }
  #digestbox { position: fixed; top: 16%; left: 50%; transform: translateX(-50%);
               width: 400px; max-width: 88%; background: #f6f6ef; z-index: 91;
               border: 1px solid #4a7023; border-top: 5px solid #4a7023;
               padding: 14px 18px 16px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); }
  #digestbox h2 { font-size: 11pt; margin: 0 0 6px; color: #3b5a1c; }
  #digestbox p { font-size: 9pt; line-height: 1.5; color: #3a3a30; margin: 0 0 10px; }
  #digestbox .fine { font-size: 7pt; color: #828282; margin: 8px 0 0; }
  #digestbox input { font-family: inherit; font-size: 9pt; padding: 4px 5px;
                     border: 1px solid #b9b9a8; background: #fff; width: 58%; }
  #digestbox button.join { font-family: inherit; font-size: 9pt; padding: 4px 12px;
                           margin-left: 5px; border: 1px solid #4a7023; background: #4a7023;
                           color: #fff; cursor: pointer; }
  #digestclose { position: absolute; top: 4px; right: 5px; width: 20px; height: 20px;
                 line-height: 18px; font-family: inherit; font-size: 11pt; padding: 0;
                 border: 1px solid #c4c4b4; background: #ecece1; color: #5a5a4a;
                 cursor: pointer; }
  #digestbox .note { font-size: 8pt; color: #3b5a1c; margin: 0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <span id="logo">HB</span><b>Hacker Bulletin</b>
    <a href="/news/">new</a> <a href="/news/">past</a> <a href="/news/">comments</a>
    <a href="/news/">ask</a> <a href="/news/">show</a> <a href="/news/">jobs</a>
    <span style="float:right"><a href="/news/">login</a></span>
  </div>
  <table class="itemlist" id="itemlist"></table>
  <div id="footer">
    Guidelines | FAQ | Lists | API | Security | Legal | Contact<br>
    Search stories from the past year. Submissions are ranked by votes and by how quickly
    they attract discussion; flagged posts drop off the front page automatically.
  </div>
</div>
<script>
  fetch('items.json')
    .then((r) => r.json())
    .then((items) => {
      const list = document.getElementById('itemlist');
      for (const item of items) {
        const site = item.site
          ? ` <span class="sitebit">(${item.site})</span>`
          : '';
        const arrow =
          item.type === 'job'
            ? ''
            : '<a href="/news/" title="upvote"><div class="votearrow"></div></a>';
        const itemUrl = `item.html?id=${item.rank}`;
        const comments =
          item.comments === 0
            ? `<a href="${itemUrl}">discuss</a>`
            : `<a href="${itemUrl}">${item.comments}&nbsp;comment${item.comments === 1 ? '' : 's'}</a>`;
        const subtext =
          item.type === 'job'
            ? `${item.age} | <a href="${itemUrl}">hide</a>`
            : `${item.points} points by <a href="/news/">${item.author}</a> ` +
              `<a href="/news/">${item.age}</a> | <a href="/news/">hide</a> | ` +
              `<a href="/news/">past</a> | <a href="/news/">flag</a> | ${comments}`;
        list.insertAdjacentHTML(
          'beforeend',
          `<tr>
             <td class="rank">${item.rank}.</td>
             <td class="rank">${arrow}</td>
             <td class="title"><a href="${itemUrl}">${item.title}</a>${site}</td>
           </tr>
           <tr>
             <td colspan="2"></td>
             <td class="subtext">${subtext}</td>
           </tr>`
        );
      }
      list.insertAdjacentHTML(
        'beforeend',
        '<tr><td colspan="2"></td><td class="title"><a href="/news/">More</a></td></tr>'
      );
    });
</script>
<script>
  (function () {
    if (new URLSearchParams(location.search).get('promo') !== '1') return;

    const NONCE = '__SESSION_NONCE__';
    let closed = false;

    function announce() {
      return fetch('/api/modal-shown', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nonce: NONCE }),
      });
    }

    // Announced before the modal exists, so a dismissal can never reach the
    // server before the server knows the modal was shown.
    let announceSettled = false;
    const announced = announce()
      .catch(() => {})
      .finally(() => {
        announceSettled = true;
      });

    function post(method) {
      const opts = {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nonce: NONCE, method }),
        keepalive: true,
      };
      return fetch('/api/modal-dismiss', opts).then((res) =>
        res.status === 409 ? announce().then(() => fetch('/api/modal-dismiss', opts)) : res
      );
    }

    function send(method, viaBeacon) {
      if (viaBeacon && navigator.sendBeacon) {
        // Sent synchronously: it has to survive a same-turn navigation. If the
        // announce is still in flight it may arrive too early, so fall through
        // to the ordered retry in that case only.
        navigator.sendBeacon(
          '/api/modal-dismiss',
          new Blob([JSON.stringify({ nonce: NONCE, method })], {
            type: 'application/json',
          })
        );
        if (announceSettled) return;
      }
      announced.then(() => post(method)).catch(() => {});
    }

    const veil = document.createElement('div');
    veil.id = 'digestveil';

    const box = document.createElement('div');
    box.id = 'digestbox';
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-labelledby', 'digesttitle');
    box.innerHTML =
      '<button id="digestclose" type="button" aria-label="Close" title="Close">&times;</button>' +
      '<h2 id="digesttitle">The Bulletin Digest</h2>' +
      '<p>One email each Friday with the ten highest-ranked posts of the week, the ' +
      'best comment thread we saw, and nothing else. Free while it stays small.</p>' +
      '<div><input id="digestemail" type="email" autocomplete="email" ' +
      'placeholder="you@example.com" aria-label="Email address">' +
      '<button class="join" id="digestjoin" type="button">Join</button></div>' +
      '<p class="fine" id="digestfine">We send one message a week and never share the ' +
      'list. Unsubscribe from the footer of any issue.</p>';

    const wrap = document.getElementById('wrap');

    function focusables() {
      return Array.from(
        box.querySelectorAll('button, input, [href], [tabindex]:not([tabindex="-1"])')
      ).filter((el) => !el.disabled && el.offsetParent !== null);
    }

    function onKeydown(e) {
      if (closed) return;
      if (e.key === 'Escape') {
        e.preventDefault();
        dismiss('esc');
        return;
      }
      if (e.key !== 'Tab') return;
      const list = focusables();
      if (!list.length) return;
      const first = list[0];
      const last = list[list.length - 1];
      const active = document.activeElement;
      if (e.shiftKey && (active === first || !box.contains(active))) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && (active === last || !box.contains(active))) {
        e.preventDefault();
        first.focus();
      }
    }

    function onFocusIn(e) {
      if (closed || box.contains(e.target)) return;
      const list = focusables();
      if (list.length) list[0].focus();
    }

    function teardown() {
      document.removeEventListener('keydown', onKeydown, true);
      document.removeEventListener('focusin', onFocusIn, true);
      veil.remove();
      box.remove();
      if (wrap) wrap.removeAttribute('aria-hidden');
    }

    const observer = new MutationObserver(() => {
      if (closed || (box.isConnected && veil.isConnected)) return;
      closed = true;
      observer.disconnect();
      send('removed', true);
      teardown();
    });

    function dismiss(method) {
      if (closed) return;
      closed = true;
      observer.disconnect();
      send(method);
      teardown();
    }

    veil.addEventListener('click', () => {
      if (!closed) send('overlay');
    });
    box.addEventListener('click', (e) => {
      if (e.target.id === 'digestclose') dismiss('button');
      if (e.target.id !== 'digestjoin') return;
      const email = box.querySelector('#digestemail');
      const fine = box.querySelector('#digestfine');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim())) {
        fine.textContent = 'Enter a valid email address to join the digest.';
        return;
      }
      fine.className = 'note';
      fine.textContent = 'Almost there: confirm the link we just emailed you.';
    });

    document.addEventListener('keydown', onKeydown, true);
    document.addEventListener('focusin', onFocusIn, true);

    if (wrap) wrap.setAttribute('aria-hidden', 'true');
    document.body.prepend(veil, box);
    observer.observe(document.documentElement, { childList: true, subtree: true });
    box.querySelector('#digestclose').focus();
  })();
</script>
</body>
</html>
